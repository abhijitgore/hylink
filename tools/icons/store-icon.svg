<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The store icon: the same slab as icon.svg, at 96x96 with the 16px of
       transparent padding per side the Chrome Web Store asks for. Toolbar icons
       should fill their box; this one deliberately should not. Generated from
       icon.svg by tools/icons/build.sh — do not edit by hand. -->
  <g transform="translate(16 16) scale(0.75)">
  <!--
    The source for icons/*.png — regenerate with tools/icons/build.sh rather than
    editing the PNGs.

    Liquid Glass, which is not the same thing as the glossy tiles of 2008. The
    difference is where the light lives. A glossy icon puts a big specular sheen
    across the top of the *surface*; glass puts the light in the *edges*, because
    that is where a real slab bends it. So:

      - the face stays clear and saturated, with only a wide, soft diagonal wash
      - the rim carries the brightness, and unevenly: bright where it faces the
        light at the top-left, bright again where light exits at the bottom-right,
        nearly gone along the two sides
      - a dark line just inside the rim gives the slab thickness; without it the
        bright rim reads as a stroke rather than an edge
      - the glyph is embedded, not printed: a refraction offset below it and a
        faint highlight above

    Everything is baked, because a PNG cannot be translucent over whatever Chrome
    puts behind it, and the icon has to hold up on both light and dark toolbars.
  -->
  <defs>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#6d6bf5"/>
      <stop offset="0.45" stop-color="#5145e0"/>
      <stop offset="1"    stop-color="#3b2fb5"/>
    </linearGradient>

    <!-- Wide and soft. A hard edge here is what makes an icon look glossy. -->
    <linearGradient id="wash" x1="0.05" y1="0" x2="0.7" y2="0.85">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Light gathering as it leaves the far edge of the slab. -->
    <linearGradient id="exit" x1="0.4" y1="0.55" x2="1" y2="1">
      <stop offset="0"   stop-color="#c7d2fe" stop-opacity="0"/>
      <stop offset="1"   stop-color="#dbeafe" stop-opacity="0.26"/>
    </linearGradient>

    <!-- The rim: two bright arcs, two dim flanks. This is the whole effect. -->
    <linearGradient id="rim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.18" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.82" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Thickness. The dark side sits opposite the lit side. -->
    <linearGradient id="depth" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0"    stop-color="#1a1560" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#1a1560" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#1a1560" stop-opacity="0.05"/>
    </linearGradient>

    <clipPath id="tile">
      <rect width="128" height="128" rx="29"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#body)"/>
    <rect width="128" height="128" fill="url(#wash)"/>
    <rect width="128" height="128" fill="url(#exit)"/>
  </g>

  <!-- The mark, sitting inside the glass rather than printed on it. -->
  <g fill="none" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#181254" opacity="0.30" transform="translate(0 2.5)">
      <path d="M58 44H42a12 12 0 0 0-12 12v30a12 12 0 0 0 12 12h30a12 12 0 0 0 12-12V70"/>
      <path d="M62 66 96 32"/>
      <path d="M74 32h22v22"/>
    </g>
    <g stroke="#ffffff">
      <path d="M58 44H42a12 12 0 0 0-12 12v30a12 12 0 0 0 12 12h30a12 12 0 0 0 12-12V70"/>
      <path d="M62 66 96 32"/>
      <path d="M74 32h22v22"/>
    </g>
  </g>

  <!-- Drawn last, so the edge sits over everything the way a real one would. -->
  <rect x="2.1" y="2.1" width="123.8" height="123.8" rx="27.2"
        fill="none" stroke="url(#depth)" stroke-width="2.6"/>
  <rect x="0.85" y="0.85" width="126.3" height="126.3" rx="28.2"
        fill="none" stroke="url(#rim)" stroke-width="1.7"/>
</g>
</svg>
