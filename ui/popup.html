<!doctype html>
<meta charset="utf-8">
<title>HyLink</title>
<link rel="stylesheet" href="ui.css">
<main class="popup">
  <h1>HyLink</h1>
  <label class="switch">
    <input type="checkbox" id="enabled">
    <span><strong>Hover menu enabled</strong></span>
  </label>
  <label class="switch">
    <input type="checkbox" id="siteOff">
    <span><strong>Disable on <span id="host">this site</span></strong></span>
  </label>
  <button type="button" id="openOptions" class="link-btn">All settings…</button>
</main>
<script src="../src/settings.js"></script>
<script src="popup.js"></script>
